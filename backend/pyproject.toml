[project]
name = "aisoc-backend"
version = "0.1.0"
description = "AI-SOC FastAPI backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["E402"]
"migrations/*" = ["I001"]
